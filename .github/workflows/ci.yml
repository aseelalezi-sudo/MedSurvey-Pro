name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: medsurvey_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: medsurvey_testing
      DB_USERNAME: root
      DB_PASSWORD: ''
      JWT_SECRET: ci-jwt-secret
      SUPER_ADMIN_USERNAME: admin
      SUPER_ADMIN_PASSWORD: ci-super-admin-password

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, sodium
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Validate and audit locked PHP dependencies
        run: |
          composer validate
          composer audit --locked

      - name: Exercise release success and failure paths
        run: bash tests/deploy-release.sh

      - name: Rehearse legacy cutover and compatible rollback
        env:
          DB_DATABASE: pr23_transition_test
          CHECK_WEB_PERMISSIONS: '1'
        run: |
          mysql -h "$DB_HOST" -u "$DB_USERNAME" -e 'CREATE DATABASE pr23_transition_test'
          sudo -n -E runuser -u "$(id -un)" -g www-data -- env PATH="$PATH" bash tests/adopt-release.sh . "$(git rev-parse cc226bf)" "$(git rev-parse HEAD)"

      - name: Prepare Laravel
        run: chmod -R u+rwX storage bootstrap/cache

      - name: Run migrations
        run: php artisan migrate -q --no-ansi --no-interaction --env=testing

      - name: Seed roles and permissions
        run: php artisan db:seed --class=Database\\Seeders\\RolesAndPermissionsSeeder --no-ansi --no-interaction --env=testing

      - name: Exercise the Ubuntu FPM, Supervisor and WebSocket configuration
        if: matrix.php == '8.2'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx-light supervisor
          if ! test -x /usr/sbin/php-fpm8.2; then
            sudo add-apt-repository -y ppa:ondrej/php
            sudo apt-get install -y -qq php8.2-fpm
          fi
          bash tests/ubuntu-ingress.sh

      - name: Run Pint
        run: composer run pint:test

      - name: Run Laravel tests
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Audit locked npm dependencies
        run: |
          npm audit
          npm audit --omit=dev

      - name: Build frontend
        run: npm run build

      - name: Verify generated PWA assets and a clean checkout
        run: |
          test -s public/sw.js
          test -s public/manifest.webmanifest
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Run Vitest
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

      - name: Run Prettier Check
        run: npm run format:check

  e2e:
    # Playwright 1.60 does not support Ubuntu 26.04 used by ubuntu-latest.
    runs-on: ubuntu-24.04
    needs: [backend, frontend]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: medsurvey_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: medsurvey_testing
      DB_USERNAME: root
      DB_PASSWORD: ''
      JWT_SECRET: ci-jwt-secret
      SUPER_ADMIN_USERNAME: admin
      SUPER_ADMIN_PASSWORD: ci-super-admin-password

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, sodium
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare Laravel
        run: chmod -R u+rwX storage bootstrap/cache

      - name: Run migrations
        run: php artisan migrate -q --no-ansi --no-interaction --env=testing

      - name: Seed roles and permissions
        run: php artisan db:seed --class=Database\\Seeders\\RolesAndPermissionsSeeder --no-ansi --no-interaction --env=testing

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

  mobile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --reporter compact

      # Proves the APK still compiles on every push, not only when someone
      # remembers to build it locally. The debug build is enough for that and
      # needs no signing key (release APKs are signed on the hospital machine).
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: medsurvey-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
