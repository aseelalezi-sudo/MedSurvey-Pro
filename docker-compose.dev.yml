services:
  db:
    image: mysql:8.0
    container_name: medsurvey-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: dev_password
      MYSQL_DATABASE: ${DB_DATABASE:-medsurvey}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data_dev:
