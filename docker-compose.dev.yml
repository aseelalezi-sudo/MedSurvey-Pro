services:
  db:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: medsurvey-mysql80-dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DEV_ROOT_PASSWORD:?Set MYSQL_DEV_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_DEV_USERNAME:-medsurvey_dev}
      MYSQL_PASSWORD: ${MYSQL_DEV_PASSWORD:?Set MYSQL_DEV_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DEV_DATABASE:-medsurvey_mysql_dev}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-13306}:3306"
    volumes:
      - mysql80_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql80_data_dev:
