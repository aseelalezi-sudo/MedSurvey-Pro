name: medsurvey_app
description: تطبيق MedSurvey Pro للاستبيانات مع دعم العمل دون اتصال والمزامنة التلقائية.
publish_to: "none"
version: 1.1.15+17

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.6
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5
  connectivity_plus: ^6.1.0
  workmanager: ^0.10.0
  uuid: ^4.5.1
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/brand_logo.png

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800

# The newer Android implementations of these plugins depend on package:jni,
# which compiles native code and requires a full NDK/CMake installation. The
# app has no native code, so use the last pure-Java/Kotlin releases instead.
# These are also the last versions whose Android build script is Groovy; later
# ones use build.gradle.kts with a `kotlin {}` block that only compiles under
# AGP 9's built-in Kotlin, while this project is on AGP 8.13.
dependency_overrides:
  path_provider_android: 2.2.22
  shared_preferences_android: 2.4.20
